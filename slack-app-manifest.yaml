display_information:
  name: tag
  description: Cross-channel AI teammate control plane
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: tag
    always_online: true
  slash_commands:
    - command: /tag-directive
      description: Configure tag's operating directive for this channel
      usage_hint: Opens a channel configuration form
      should_escape: false
    - command: /tag-mode
      description: Show or change tag's participation mode for this channel
      usage_hint: "observe | assist | proactive"
      should_escape: false
    - command: /tag-proactive
      description: Set tag to proactive mode in this channel
      usage_hint: Joins the public channel when possible
      should_escape: false
    - command: /tag-assist
      description: Set tag to assist mode in this channel
      usage_hint: Joins the public channel when possible
      should_escape: false
    - command: /tag-off
      description: Turn tag off in this channel
      usage_hint: Sets observe first, then leaves when possible
      should_escape: false
  agent_view:
    agent_description: Cross-channel AI teammate for investigation, planning, and durable agent work.
    suggested_prompts:
      - title: Summarize this context
        message: Summarize the current Slack context and identify unresolved decisions.
      - title: Investigate an issue
        message: Investigate this issue using the Slack context I can access and propose next steps.
      - title: Plan a task
        message: Turn this request into a safe, evidence-backed execution plan.
